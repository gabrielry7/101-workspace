[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world-model-restaurant-commerce"
version = "0.21.0"
description = "Hardened restaurant direct commerce, delivery, loyalty and retention runtime for 101 / UnoCeroUno"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "httpx>=0.27",
  "segno==1.6.6",
  "phonenumberslite==9.0.17",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27", "hypothesis>=6.100", "defusedxml==0.7.1", "boto3>=1.40", "cryptography>=44", "twilio==9.12.0", "regex==2026.9.29"]
campaign-sms = ["twilio==9.12.0", "regex==2026.9.29"]
campaign-email = ["boto3>=1.40", "cryptography>=44"]
browser = ["playwright>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"world_model.restaurant_commerce" = ["web/*.html", "web/*.js", "web/*.css", "web/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
