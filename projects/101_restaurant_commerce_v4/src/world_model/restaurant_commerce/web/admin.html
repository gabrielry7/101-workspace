<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>101 · Operación restaurante</title><style>
body{margin:0;background:#f4f3ef;color:#171512;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 20px}h1{font-family:Georgia,serif}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}input,button{padding:10px 12px;border:1px solid #d6d2ca;border-radius:9px;font:inherit}button{background:#171512;color:#fff;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:2fr 1fr;gap:22px}.card{background:#fff;border:1px solid #ddd8cf;border-radius:16px;padding:16px;margin-bottom:12px}.meta{color:#756f66;font-size:13px}.status{font-weight:800;text-transform:uppercase;font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:12px;padding:7px 10px}.total{font-weight:800}@media(max-width:800px){.grid{grid-template-columns:1fr}}

*{box-sizing:border-box}input,textarea{max-width:100%}.card,.item,.cart-row{min-width:0;overflow-wrap:anywhere}.toolbar input{min-width:0}
</style></head><body><noscript><p>Activa JavaScript en un navegador compatible para hacer pedidos. No se ha enviado ningún pedido.</p></noscript><main class="wrap"><h1>Operación del restaurante</h1><p>Pedidos directos + reservas. <a href="/delivery">Domicilios</a> · <a href="/growth">Growth</a>. Acceso personal según los permisos de cada negocio.</p><section aria-label="Sesión del personal"><form id="staffLogin"><label>Usuario <input id="staffUsername" autocomplete="username" required maxlength="120"></label><label>Contraseña <input id="staffPassword" type="password" autocomplete="current-password" required minlength="15" maxlength="128"></label><button id="staffSignIn" type="submit">Iniciar sesión</button></form><p id="staffStatus" role="status"></p><button id="staffLogout" hidden>Cerrar sesión</button><button id="staffLogoutAll" hidden>Cerrar todas mis sesiones</button><datalist id="staffBusinesses"></datalist></section><div class="toolbar"><label>Negocio <input id="business" list="staffBusinesses" autocomplete="off"></label><button data-click="refreshAll">Actualizar</button></div><div class="grid"><section><h2>Pedidos</h2><div id="orders"></div></section><section><h2>Reservas</h2><div id="reservations"></div></section></div><section><h2>Pagos que requieren revisión</h2><div id="reconciliation" aria-live="polite"></div></section><section><h2>Resolución financiera</h2><p>Entorno controlado. Solo personal con permiso financiero puede consultar o resolver estos casos.</p><div class="toolbar"><label>Pedido <input id="financeOrder" autocomplete="off"></label><label>Motivo <input id="financeReason" maxlength="500" autocomplete="off"></label><button data-click="financeHistory">Consultar historial</button><button data-click="financeLookup">Verificar pago</button><button data-click="financeRefund">Solicitar devolución completa</button></div><div id="financeResult" aria-live="polite"></div></section></main><script src="/assets/shared.js" defer></script><script src="/assets/staff.js" defer></script><script src="/assets/admin.js" defer></script></body></html>
