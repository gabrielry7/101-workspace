<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>101 · Operación restaurante</title><style>
body{margin:0;background:#f4f3ef;color:#171512;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 20px}h1{font-family:Georgia,serif}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}input,button{padding:10px 12px;border:1px solid #d6d2ca;border-radius:9px;font:inherit}button{background:#171512;color:#fff;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:2fr 1fr;gap:22px}.card{background:#fff;border:1px solid #ddd8cf;border-radius:16px;padding:16px;margin-bottom:12px}.meta{color:#756f66;font-size:13px}.status{font-weight:800;text-transform:uppercase;font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:12px;padding:7px 10px}.total{font-weight:800}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><h1>Operación del restaurante</h1><p>Pedidos directos + reservas. <a href="/delivery">Domicilios</a> · <a href="/growth">Growth</a>. Demo local; producción debe usar autenticación real.</p><div class="toolbar"><input id="business" value="demo-restaurant-bogota"><input id="token" value="dev-operator"><button onclick="refreshAll()">Actualizar</button></div><div class="grid"><section><h2>Pedidos</h2><div id="orders"></div></section><section><h2>Reservas</h2><div id="reservations"></div></section></div></main><script>
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);const hdr=()=>({'X-101-Operator-Token':token.value,'Content-Type':'application/json'});async function api(u,o={}){const r=await fetch(u,{...o,headers:{...hdr(),...(o.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.detail||r.status);return d}const next={placed:['accepted','cancelled'],accepted:['preparing','cancelled'],preparing:['ready','cancelled'],ready:['completed','cancelled']};
async function loadOrders(){try{const rows=await api(`/api/operator/restaurants/${business.value}/orders`);orders.innerHTML=rows.length?rows.map(o=>`<div class="card"><div class="status">${o.status}</div><h3>#${o.public_code} · ${o.customer_name||o.customer_phone}</h3><div>${o.items.map(i=>`${i.quantity} × ${i.name}`).join('<br>')}</div><p class="total">${money(o.total_minor)}</p><div class="meta">${o.fulfillment_type} · Pago: ${o.payment_status} · ${new Date(o.created_at).toLocaleString()}</div>${o.delivery?`<div class="meta">Delivery: ${o.delivery.status} · ${money(o.delivery_fee_minor)}</div>`:""}<div class="actions">${(next[o.status]||[]).map(s=>`<button onclick="move('${o.id}','${s}')">${s}</button>`).join('')}</div></div>`).join(''):'<p>Sin pedidos.</p>'}catch(e){orders.textContent=e.message}}
async function move(id,status){await api(`/api/operator/orders/${id}`,{method:'PATCH',body:JSON.stringify({status})});loadOrders()}
async function loadReservations(){try{const rows=await api(`/api/operator/restaurants/${business.value}/reservations`);reservations.innerHTML=rows.length?rows.map(r=>`<div class="card"><div class="status">${r.status}</div><h3>#${r.public_code}</h3><div>${r.customer_name||r.customer_phone}</div><div>${r.party_size} personas</div><div class="meta">${new Date(r.starts_at).toLocaleString()}</div><div class="actions"><button onclick="moveReservation('${r.id}','confirmed')">Confirmar</button><button onclick="moveReservation('${r.id}','cancelled')">Cancelar</button></div></div>`).join(''):'<p>Sin reservas.</p>'}catch(e){reservations.textContent=e.message}}
async function moveReservation(id,status){await api(`/api/operator/reservations/${id}`,{method:'PATCH',body:JSON.stringify({status})});loadReservations()}function refreshAll(){loadOrders();loadReservations()}refreshAll();setInterval(refreshAll,5000)
</script></body></html>
