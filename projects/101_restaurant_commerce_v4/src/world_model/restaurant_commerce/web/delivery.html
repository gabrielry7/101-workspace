<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>101 · Domicilios</title><style>
body{margin:0;background:#f4f3ef;color:#171512;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 20px}h1{font-family:Georgia,serif}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}input,button{padding:10px 12px;border:1px solid #d6d2ca;border-radius:9px;font:inherit}button{background:#171512;color:#fff;border:0;cursor:pointer}.card{background:#fff;border:1px solid #ddd8cf;border-radius:16px;padding:16px;margin-bottom:12px}.meta{color:#756f66;font-size:13px}.status{font-weight:800;text-transform:uppercase;font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:12px;padding:7px 10px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.money{font-weight:800}@media(max-width:760px){.cols{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><h1>Fulfillment / domicilios</h1><p>V3: cotización, despacho, tracking y ciclo de entrega. Los providers reales siguen detrás de una interfaz y esta demo usa courier simulado.</p><div class="toolbar"><input id="business" value="demo-restaurant-bogota"><input id="token" value="dev-operator"><button onclick="loadAll()">Actualizar</button><a href="/admin">Pedidos</a><a href="/growth">Growth</a></div><div id="rows"></div></main><script>
const hdr=()=>({'X-101-Operator-Token':token.value,'Content-Type':'application/json'});const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);async function api(u,o={}){const r=await fetch(u,{...o,headers:{...hdr(),...(o.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||r.status);return d}
async function loadAll(){try{const [ds,os]=await Promise.all([api(`/api/operator/restaurants/${business.value}/deliveries`),api(`/api/operator/restaurants/${business.value}/orders`)]),orders=new Map(os.map(o=>[o.id,o]));rows.innerHTML=ds.length?ds.map(d=>{const o=orders.get(d.order_id),buttons=[];if(d.status==='quoted'&&o&&['accepted','preparing','ready'].includes(o.status))buttons.push(`<button onclick="dispatch('${o.id}')">Despachar courier</button>`);if(d.status==='courier_assigned')buttons.push(`<button onclick="status('${d.id}','picked_up')">Recogido</button>`);if(d.status==='picked_up')buttons.push(`<button onclick="status('${d.id}','delivered')">Entregado</button>`);if(!['delivered','cancelled','failed','picked_up'].includes(d.status))buttons.push(`<button onclick="cancelDelivery('${o?.id||d.order_id}')">Cancelar delivery</button>`);return `<div class="card"><div class="cols"><div><div class="status">${d.status}</div><h3>${o?`#${o.public_code}`:d.order_id}</h3><div>${d.destination_address}</div><div class="meta">${d.destination_city} · ${d.provider}</div><p class="money">${money(d.fee_minor)}</p></div><div><div class="meta">Courier: ${d.courier_name||'—'}</div><div class="meta">Ref: ${d.provider_delivery_reference||'sin despachar'}</div><div class="meta">ETA: ${d.estimated_dropoff_at?new Date(d.estimated_dropoff_at).toLocaleString():'—'}</div><div class="meta">Pedido: ${o?.status||'—'} · pago ${o?.payment_status||'—'}</div>${d.tracking_url?`<div><a href="${d.tracking_url}">Tracking provider</a></div>`:''}</div></div><div class="actions">${buttons.join('')}</div></div>`}).join(''):'<p>Sin entregas.</p>'}catch(e){rows.innerHTML=`<p>${e.message}</p>`}}
async function dispatch(id){try{await api(`/api/operator/orders/${id}/delivery/dispatch`,{method:'POST'});loadAll()}catch(e){alert(e.message)}}async function status(id,s){try{await api(`/api/operator/deliveries/${id}/status`,{method:'PATCH',body:JSON.stringify({status:s})});loadAll()}catch(e){alert(e.message)}}async function cancelDelivery(id){try{await api(`/api/operator/orders/${id}/delivery/cancel`,{method:'POST'});loadAll()}catch(e){alert(e.message)}}loadAll();setInterval(loadAll,5000)
</script></body></html>
