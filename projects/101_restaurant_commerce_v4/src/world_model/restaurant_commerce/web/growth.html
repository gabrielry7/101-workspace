<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>101 · Growth restaurante</title><style>
body{margin:0;background:#f4f3ef;color:#171512;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px 20px}h1,h2{font-family:Georgia,serif}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}input,button{padding:10px 12px;border:1px solid #d6d2ca;border-radius:9px;font:inherit}button{background:#171512;color:white;border:0;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.metric,.card{background:#fff;border:1px solid #ddd8cf;border-radius:16px;padding:16px}.metric strong{font-size:24px;display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.card{margin-bottom:10px}.muted{color:#756f66;font-size:13px}.queued{color:#176329}.suppressed{color:#a23a25}@media(max-width:800px){.grid{grid-template-columns:1fr}}

*{box-sizing:border-box}input,textarea{max-width:100%}.card,.item,.cart-row{min-width:0;overflow-wrap:anywhere}.toolbar input{min-width:0}
</style></head><body><noscript><p>Activa JavaScript en un navegador compatible para hacer pedidos. No se ha enviado ningún pedido.</p></noscript><main class="wrap"><h1>Growth del restaurante</h1><p>CRM ligero, loyalty, promociones y automatizaciones. Preparar o abrir WhatsApp no confirma un envío. El outbox conserva ese estado separado.</p><section aria-label="Sesión del personal"><form id="staffLogin"><label>Usuario <input id="staffUsername" autocomplete="username" required maxlength="120"></label><label>Contraseña <input id="staffPassword" type="password" autocomplete="current-password" required minlength="15" maxlength="128"></label><button id="staffSignIn" type="submit">Iniciar sesión</button></form><p id="staffStatus" role="status"></p><button id="staffLogout" hidden>Cerrar sesión</button><button id="staffLogoutAll" hidden>Cerrar todas mis sesiones</button><datalist id="staffBusinesses"></datalist></section><div class="toolbar"><label>Negocio <input id="business" list="staffBusinesses" autocomplete="off"></label><button data-click="refreshAll">Actualizar</button><button data-click="planWinback">Planear win-back</button></div><section class="metrics" id="metrics"></section><div class="grid"><section><h2>Promociones</h2><div id="promos"></div><h2>Rewards</h2><div id="rewards"></div></section><section><h2>Outbox WhatsApp</h2><div id="outbox"></div></section></div></main><script src="/assets/shared.js" defer></script><script src="/assets/staff.js" defer></script><script src="/assets/growth.js" defer></script></body></html>
