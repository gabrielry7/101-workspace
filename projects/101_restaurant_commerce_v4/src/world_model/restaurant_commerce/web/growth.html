<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>101 · Growth restaurante</title><style>
body{margin:0;background:#f4f3ef;color:#171512;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px 20px}h1,h2{font-family:Georgia,serif}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}input,button{padding:10px 12px;border:1px solid #d6d2ca;border-radius:9px;font:inherit}button{background:#171512;color:white;border:0;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.metric,.card{background:#fff;border:1px solid #ddd8cf;border-radius:16px;padding:16px}.metric strong{font-size:24px;display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.card{margin-bottom:10px}.muted{color:#756f66;font-size:13px}.queued{color:#176329}.suppressed{color:#a23a25}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><h1>Growth del restaurante</h1><p>CRM ligero, loyalty, promociones y automatizaciones. El outbox no envía mensajes por sí solo.</p><div class="toolbar"><input id="business" value="demo-restaurant-bogota"><input id="token" value="dev-operator"><button onclick="refreshAll()">Actualizar</button><button onclick="planWinback()">Planear win-back</button></div><section class="metrics" id="metrics"></section><div class="grid"><section><h2>Promociones</h2><div id="promos"></div><h2>Rewards</h2><div id="rewards"></div></section><section><h2>Outbox WhatsApp</h2><div id="outbox"></div></section></div></main><script>
const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);const headers=()=>({'X-101-Operator-Token':token.value,'Content-Type':'application/json'});async function api(u,o={}){const r=await fetch(u,{...o,headers:{...headers(),...(o.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.detail||r.status);return d}
async function loadAnalytics(){const a=await api(`/api/operator/restaurants/${business.value}/analytics`);const vals=[['Pedidos completos',a.completed_orders],['Ventas netas',money(a.net_revenue_minor)],['Ticket promedio',money(a.average_order_value_minor)],['Clientes',a.unique_customers],['Clientes repetidos',`${Math.round(a.repeat_customer_rate*100)}%`],['Puntos pendientes',a.loyalty_points_outstanding],['Mensajes en cola',a.queued_messages],['Suprimidos',a.suppressed_messages]];metrics.innerHTML=vals.map(([k,v])=>`<div class="metric"><span class="muted">${k}</span><strong>${v}</strong></div>`).join('')}
async function loadPromos(){const rows=await api(`/api/operator/restaurants/${business.value}/promotions`);promos.innerHTML=rows.map(p=>`<div class="card"><strong>${p.code}</strong> · ${p.name}<div class="muted">${p.discount_type==='percent'?`${p.value/100}%`:money(p.value)} · mínimo ${money(p.minimum_order_minor)}</div></div>`).join('')||'<p>Sin promociones.</p>'}
async function loadRewards(){const rows=await api(`/api/operator/restaurants/${business.value}/rewards`);rewards.innerHTML=rows.map(r=>`<div class="card"><strong>${r.name}</strong><div>${r.points_cost} puntos → ${money(r.discount_minor)}</div><div class="muted">${r.description||''}</div></div>`).join('')||'<p>Sin rewards.</p>'}
async function loadOutbox(){const rows=await api(`/api/operator/restaurants/${business.value}/outbox`);outbox.innerHTML=rows.map(m=>`<div class="card"><strong class="${m.status}">${m.status}</strong> · ${m.message_kind}<div>${m.body}</div><div class="muted">${m.destination} · ${new Date(m.scheduled_at).toLocaleString()}${m.suppression_reason?` · ${m.suppression_reason}`:''}</div>${m.status==='queued'?`<button onclick="openWA('${m.id}','${m.destination}',${JSON.stringify(m.body).replace(/"/g,'&quot;')})">Abrir WhatsApp</button>`:''}</div>`).join('')||'<p>Outbox vacío.</p>'}
async function openWA(id,phone,body){window.open(`https://wa.me/${phone.replace(/\D/g,'')}?text=${encodeURIComponent(body)}`,'_blank');await api(`/api/operator/outbox/${id}/sent`,{method:'PATCH',body:'{}'});loadOutbox()}
async function planWinback(){await api(`/api/operator/restaurants/${business.value}/winback/plan`,{method:'POST',body:JSON.stringify({limit:100})});refreshAll()}
async function refreshAll(){try{await Promise.all([loadAnalytics(),loadPromos(),loadRewards(),loadOutbox()])}catch(e){alert(e.message)}}refreshAll();
</script></body></html>
