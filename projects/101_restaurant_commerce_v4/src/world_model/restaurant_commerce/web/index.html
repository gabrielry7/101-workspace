<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casa 101 · Pedido directo</title>
<style>
:root{--bg:#f6f2eb;--ink:#171512;--muted:#746f67;--card:#fff;--line:#ded7ca;--accent:#171512;--soft:#eee8df;--good:#eaf5e8;--bad:#fff0ed}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(246,242,235,.96);backdrop-filter:blur(8px);z-index:5}.top{max-width:1180px;margin:auto;display:flex;justify-content:space-between;gap:18px;align-items:center}.brand h1{margin:0;font:600 30px Georgia,serif}.brand p{margin:4px 0 0;color:var(--muted)}
.shell{max-width:1180px;margin:28px auto;padding:0 20px;display:grid;grid-template-columns:1fr 380px;gap:28px}.section-title{font:600 24px Georgia,serif;margin:28px 0 12px}.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:18px}.item h3{margin:0 0 6px}.item p{margin:0;color:var(--muted);line-height:1.45}.price{margin-top:12px;font-weight:700}.sold{opacity:.5}
button{border:0;border-radius:999px;background:var(--accent);color:white;padding:11px 16px;font-weight:700;cursor:pointer}button.secondary{background:var(--soft);color:var(--ink)}button:disabled{opacity:.45;cursor:not-allowed}.pill{display:flex;gap:8px;background:var(--soft);padding:5px;border-radius:999px}.pill button{flex:1}.pill button.off{background:transparent;color:var(--ink)}
.cart{position:sticky;top:110px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;height:max-content}.cart h2{margin:0 0 14px;font:600 24px Georgia,serif}.cart-row{padding:12px 0;border-bottom:1px solid var(--line)}.cart-row small,.muted{color:var(--muted)}.line{display:flex;justify-content:space-between;margin:8px 0}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:16px 0;border-top:1px solid var(--line);padding-top:14px}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:white;font:inherit;margin:5px 0 9px}.tabs{display:flex;gap:8px;margin-bottom:14px}.hidden{display:none!important}.delivery-box{background:#faf8f4;border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}.coords{display:grid;grid-template-columns:1fr 1fr;gap:8px}
dialog{border:0;border-radius:20px;max-width:520px;width:calc(100% - 30px);padding:0;box-shadow:0 30px 90px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.36)}.modal{padding:22px}.modifier{padding:12px 0;border-top:1px solid var(--line)}.option{display:flex;gap:10px;align-items:center;margin:8px 0}.option input{width:auto;margin:0}.notice{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:12px 0}.success{background:var(--good)}.error{background:var(--bad)}
@media(max-width:820px){.shell{grid-template-columns:1fr}.cart{position:static}.top{align-items:flex-start}.brand h1{font-size:26px}}
</style></head>
<body>
<header><div class="top"><div class="brand"><h1 id="restaurantName">Cargando…</h1><p id="restaurantMeta">Pedido directo</p></div><button onclick="document.getElementById('cart').scrollIntoView({behavior:'smooth'})">Ver pedido <span id="cartCount"></span></button></div></header>
<main class="shell"><section>
<div class="tabs"><button onclick="showOrder()">Pedir</button><button class="secondary" onclick="showReservation()">Reservar</button></div><div id="notice"></div><div id="menu"></div>
<div id="reservationPanel" class="hidden"><h2 class="section-title">Reserva una mesa</h2><div class="item" style="display:block"><input id="rName" placeholder="Nombre"><input id="rPhone" placeholder="WhatsApp / teléfono"><input id="rDate" type="datetime-local"><input id="rParty" type="number" min="1" value="2"><textarea id="rNotes" placeholder="Nota (opcional)"></textarea><button onclick="reserve()">Solicitar reserva</button></div></div>
</section>
<aside class="cart" id="cart"><h2>Tu pedido</h2>
<div id="fulfillmentChooser" class="pill"><button id="pickupBtn" onclick="setFulfillment('pickup')">Recoger</button><button id="deliveryBtn" class="off" onclick="setFulfillment('delivery')">Domicilio</button></div>
<div id="cartRows"><p class="muted">Todavía no has agregado nada.</p></div>
<div class="line"><span>Comida</span><span id="foodTotal">$0</span></div><div class="line hidden" id="deliveryLine"><span>Domicilio</span><span id="deliveryFee">—</span></div><div class="line hidden" id="discountLine"><span>Descuento</span><span id="discountTotal">$0</span></div><div class="total"><span>Total</span><span id="cartTotal">$0</span></div>
<div id="deliveryPanel" class="delivery-box hidden"><strong>¿A dónde lo llevamos?</strong><input id="dAddress" placeholder="Dirección" oninput="invalidateDeliveryQuote()"><input id="dInstructions" placeholder="Apto, torre, portería..." oninput="invalidateDeliveryQuote()"><div class="coords"><input id="dLat" type="number" step="any" placeholder="Latitud" oninput="invalidateDeliveryQuote()"><input id="dLng" type="number" step="any" placeholder="Longitud" oninput="invalidateDeliveryQuote()"></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="secondary" onclick="useLocation()">Usar mi ubicación</button><button class="secondary" onclick="demoAddress()">Dirección demo</button><button onclick="quoteDelivery()">Cotizar domicilio</button></div><p class="muted" id="deliveryQuoteText">Necesitamos coordenadas para esta demo. En producción aquí entra geocodificación.</p></div>
<input id="cName" placeholder="Tu nombre"><input id="cPhone" placeholder="WhatsApp / teléfono" oninput="quoteCart()"><input id="cEmail" placeholder="Email (opcional)"><input id="promoCode" placeholder="Código promocional (opcional)" oninput="quoteCart()"><label class="option"><input id="whatsappOptIn" type="checkbox"> <span>Actualizaciones por WhatsApp</span></label><label class="option"><input id="marketingOptIn" type="checkbox"> <span>Promociones y beneficios</span></label><textarea id="cNotes" placeholder="Notas del pedido"></textarea><button id="checkoutButton" style="width:100%" onclick="checkout()">Hacer pedido para recoger</button><p id="pickupInstructions" class="muted"></p>
</aside></main>
<dialog id="itemDialog"><div class="modal"><button class="secondary" style="float:right" onclick="itemDialog.close()">Cerrar</button><h2 id="modalName"></h2><p id="modalDescription" class="muted"></p><div id="modifierGroups"></div><div class="total"><span>Total unidad</span><span id="modalTotal"></span></div><button onclick="addConfiguredItem()">Agregar al pedido</button></div></dialog>
<script>
const qs=new URLSearchParams(location.search),businessId=qs.get('business_id')||'demo-restaurant-bogota';let store=null,cart=[],activeItem=null,foodQuote=null,deliveryQuote=null,fulfillment='pickup';const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);const $=id=>document.getElementById(id);
function notice(msg,type='success'){$('notice').innerHTML=`<div class="notice ${type}">${msg}</div>`;setTimeout(()=>{$('notice').innerHTML=''},7000)}async function api(url,opts={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||`HTTP ${r.status}`);return d}
async function load(){try{store=await api(`/api/restaurants/${businessId}/storefront`);$('restaurantName').textContent=store.display_name;document.title=`${store.display_name} · Pedido directo`;$('pickupInstructions').textContent=store.pickup_instructions||'';if(!store.delivery_enabled)$('deliveryBtn').disabled=true;if(!store.pickup_enabled&&store.delivery_enabled)setFulfillment('delivery');renderMenu()}catch(e){notice(e.message,'error')}}
function renderMenu(){const root=$('menu');root.innerHTML='';for(const menu of store.menus)for(const cat of menu.categories){root.insertAdjacentHTML('beforeend',`<h2 class="section-title">${esc(cat.name)}</h2>${cat.description?`<p>${esc(cat.description)}</p>`:''}`);for(const item of cat.items){const el=document.createElement('article');el.className='item '+(!item.available?'sold':'');el.innerHTML=`<div><h3>${esc(item.name)}</h3><p>${esc(item.description||'')}</p><div class="price">${money(item.base_price_minor)}</div></div><div><button ${!item.available?'disabled':''}>${item.modifier_groups.length?'Elegir':'Agregar'}</button></div>`;el.querySelector('button').onclick=()=>openItem(item);root.appendChild(el)}}}
function openItem(item){activeItem=item;if(!item.modifier_groups.length){cart.push({item,quantity:1,selections:[]});renderCart();return}$('modalName').textContent=item.name;$('modalDescription').textContent=item.description||'';const root=$('modifierGroups');root.innerHTML='';item.modifier_groups.forEach(g=>{const d=document.createElement('div');d.className='modifier';d.innerHTML=`<strong>${esc(g.name)}</strong> <small>${g.required?'(obligatorio)':''}</small><div>${g.options.map(o=>`<label class="option"><input type="${g.max_selections===1?'radio':'checkbox'}" name="g_${g.id}" value="${o.id}" data-price="${o.price_delta_minor}"><span>${esc(o.name)} ${o.price_delta_minor?`(+${money(o.price_delta_minor)})`:''}</span></label>`).join('')}</div>`;root.appendChild(d)});root.querySelectorAll('input').forEach(x=>x.onchange=updateModalTotal);updateModalTotal();itemDialog.showModal()}
function updateModalTotal(){let total=activeItem.base_price_minor;document.querySelectorAll('#modifierGroups input:checked').forEach(x=>total+=Number(x.dataset.price));$('modalTotal').textContent=money(total)}function addConfiguredItem(){const selections=[];for(const g of activeItem.modifier_groups){const ids=[...document.querySelectorAll(`input[name="g_${g.id}"]:checked`)].map(x=>x.value),min=Math.max(g.min_selections,g.required?1:0);if(ids.length<min)return notice(`Elige ${min} opción(es) en ${g.name}`,'error');if(ids.length>g.max_selections)return notice(`Máximo ${g.max_selections} opción(es) en ${g.name}`,'error');selections.push({group_id:g.id,option_ids:ids})}cart.push({item:activeItem,quantity:1,selections});itemDialog.close();renderCart()}
function cartPayload(){return cart.map(x=>({menu_item_id:x.item.id,quantity:x.quantity,modifiers:x.selections}))}function renderCart(){const root=$('cartRows'),count=cart.reduce((a,x)=>a+x.quantity,0);$('cartCount').textContent=count?`(${count})`:'';if(!cart.length){root.innerHTML='<p class="muted">Todavía no has agregado nada.</p>';foodQuote=null;renderTotals();return}root.innerHTML=cart.map((x,i)=>`<div class="cart-row"><strong>${x.quantity} × ${esc(x.item.name)}</strong><br><small>${money(x.item.base_price_minor)}</small><button class="secondary" style="padding:5px 9px;float:right" onclick="removeItem(${i})">Quitar</button></div>`).join('');quoteCart()}function removeItem(i){cart.splice(i,1);renderCart()}
async function quoteCart(){if(!cart.length)return;try{foodQuote=await api(`/api/restaurants/${businessId}/orders/quote`,{method:'POST',body:JSON.stringify({items:cartPayload(),promo_code:$('promoCode').value.trim()||null,customer_phone:$('cPhone').value.trim()||null})});renderTotals()}catch(e){notice(e.message,'error')}}function renderTotals(){const food=foodQuote?.total_minor||0,sub=foodQuote?.subtotal_minor||0,disc=foodQuote?.discounts?.total_discount_minor||0,delivery=fulfillment==='delivery'?(deliveryQuote?.fee_minor||0):0;$('foodTotal').textContent=money(food);$('deliveryLine').classList.toggle('hidden',fulfillment!=='delivery');$('deliveryFee').textContent=deliveryQuote?money(deliveryQuote.fee_minor):'Sin cotizar';$('discountLine').classList.toggle('hidden',!disc);$('discountTotal').textContent=`−${money(disc)}`;$('cartTotal').textContent=money(food+delivery)}
function setFulfillment(type){if(type==='delivery'&&!store?.delivery_enabled)return notice('Domicilios no disponibles.','error');if(type==='pickup'&&!store?.pickup_enabled)return;fulfillment=type;$('pickupBtn').classList.toggle('off',type!=='pickup');$('deliveryBtn').classList.toggle('off',type!=='delivery');$('deliveryPanel').classList.toggle('hidden',type!=='delivery');$('checkoutButton').textContent=type==='delivery'?'Pedir a domicilio':'Hacer pedido para recoger';renderTotals()}
function invalidateDeliveryQuote(){deliveryQuote=null;$('deliveryQuoteText').textContent='La dirección cambió. Cotiza de nuevo.';renderTotals()}function demoAddress(){$('dAddress').value='Calle 85 # 12-34';$('dLat').value='4.6697';$('dLng').value='-74.0549';invalidateDeliveryQuote()}function useLocation(){if(!navigator.geolocation)return notice('Tu navegador no ofrece ubicación.','error');navigator.geolocation.getCurrentPosition(p=>{$('dLat').value=p.coords.latitude;$('dLng').value=p.coords.longitude;invalidateDeliveryQuote();notice('Ubicación capturada. Escribe tu dirección y cotiza.')},e=>notice(e.message,'error'))}
async function quoteDelivery(){const address=$('dAddress').value.trim(),lat=Number($('dLat').value),lng=Number($('dLng').value);if(!address||!Number.isFinite(lat)||!Number.isFinite(lng)||!$('dLat').value||!$('dLng').value)return notice('Completa dirección y coordenadas.','error');try{deliveryQuote=await api(`/api/restaurants/${businessId}/delivery/quote`,{method:'POST',body:JSON.stringify({destination:{address_line:address,city:'Bogotá',latitude:lat,longitude:lng,instructions:$('dInstructions').value.trim()||null}})});$('deliveryQuoteText').textContent=`Domicilio ${money(deliveryQuote.fee_minor)} · aprox. ${Math.round((deliveryQuote.distance_meters||0)/100)/10} km · cotización temporal`;renderTotals()}catch(e){notice(e.message,'error')}}
async function checkout(){if(!cart.length)return notice('Agrega algo al pedido.','error');const name=$('cName').value.trim(),phone=$('cPhone').value.trim();if(!name||!phone)return notice('Necesitamos tu nombre y teléfono.','error');if(fulfillment==='delivery'&&!deliveryQuote)return notice('Cotiza el domicilio antes de continuar.','error');try{const order=await api(`/api/restaurants/${businessId}/orders`,{method:'POST',body:JSON.stringify({customer:{name,phone,email:$('cEmail').value.trim()||null,whatsapp_opt_in:$('whatsappOptIn').checked,marketing_opt_in:$('marketingOptIn').checked,consent_source:'web_checkout'},items:cartPayload(),fulfillment_type:fulfillment,delivery_quote_id:fulfillment==='delivery'?deliveryQuote.id:null,notes:$('cNotes').value.trim()||null,payment_provider:store.payment_provider,promo_code:$('promoCode').value.trim()||null,idempotency_key:crypto.randomUUID()})});if(store.payment_provider==='simulated'){await api(`/api/payments/simulated/${order.payments[0].provider_reference}/complete`,{method:'POST'})}else if(order.payments[0]?.checkout_url){window.location.assign(order.payments[0].checkout_url);return}cart=[];foodQuote=null;deliveryQuote=null;renderCart();$('promoCode').value='';notice(`Pedido #${order.public_code} recibido. ${order.fulfillment_type==='delivery'?`Domicilio: ${money(order.delivery_fee_minor)}. `:'Recogida en restaurante. '}${store.payment_provider==='simulated'?'Pago demo aprobado.':'Continúa con el pago indicado.'}`)}catch(e){notice(e.message,'error')}}
function showReservation(){$('menu').classList.add('hidden');$('reservationPanel').classList.remove('hidden')}function showOrder(){$('menu').classList.remove('hidden');$('reservationPanel').classList.add('hidden')}async function reserve(){const name=rName.value.trim(),phone=rPhone.value.trim(),starts=rDate.value;if(!name||!phone||!starts)return notice('Completa nombre, teléfono y hora.','error');try{const r=await api(`/api/restaurants/${businessId}/reservations`,{method:'POST',body:JSON.stringify({customer:{name,phone,whatsapp_opt_in:true,consent_source:'web_reservation'},starts_at:new Date(starts).toISOString(),party_size:Number(rParty.value),notes:rNotes.value.trim()||null})});notice(`Reserva #${r.public_code} solicitada para ${r.party_size} personas.`)}catch(e){notice(e.message,'error')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();
</script></body></html>
