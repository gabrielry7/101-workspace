name: Commerce security gate
# Manual until a repository owner confirms free hosted-runner allowance or a local runner.
# No automatic paid jobs; no deployment credentials and no production deployment.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: commerce-security-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: projects/101_restaurant_commerce_v4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install local prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client libpq-dev
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
          python -m pip install uv==0.9.5
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Qualify actual artifact with PostgreSQL, browser and scanners
        env:
          RUN_DIR: ${{ runner.temp }}/commerce-security-run
          TOOL_CACHE: ${{ runner.temp }}/commerce-security-tools
        run: python security/check.py --cache "$TOOL_CACHE" --run-dir "$RUN_DIR"
      - name: Preserve redacted qualification summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: commerce-security-evidence
          path: |
            ${{ runner.temp }}/commerce-security-run/evidence/gate.json
            ${{ runner.temp }}/commerce-security-run/evidence/layers.json
            ${{ runner.temp }}/commerce-security-run/evidence/findings.json
            ${{ runner.temp }}/commerce-security-run/evidence/artifact.json
            ${{ runner.temp }}/commerce-security-run/evidence/source-sha256.json
            ${{ runner.temp }}/commerce-security-run/evidence/pytest-proof.json
            ${{ runner.temp }}/commerce-security-run/evidence/tests.xml
            ${{ runner.temp }}/commerce-security-run/evidence/execution.json
          if-no-files-found: error
          retention-days: 7
